name: Send Push Notification

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Заголовок уведомления'
        required: true
        default: 'Новая статья!'
      body:
        description: 'Текст уведомления'
        required: true
        default: 'Читайте новую статью в блоге'
      url:
        description: 'Ссылка (относительная)'
        required: true
        default: '/blog'
      image:
        description: 'URL изображения (опционально)'
        required: false
        default: ''
      type:
        description: 'Тип уведомления'
        required: false
        default: 'new-article'

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd .github/workflows/scripts
          npm install

      - name: Send Push Notification
        run: |
          cd .github/workflows/scripts
          
          # Записываем JSON в файл для избежания проблем с экранированием
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          
          node send-push.cjs \
            --title "${{ github.event.inputs.title || 'Новая статья!' }}" \
            --body "${{ github.event.inputs.body || 'Читайте новую статью в блоге' }}" \
            --url "${{ github.event.inputs.url || '/blog' }}" \
            --image "${{ github.event.inputs.image || '' }}" \
            --type "${{ github.event.inputs.type || 'new-article' }}"
        env:
          NUXT_FIREBASE_VAPID_KEY: ${{ secrets.NUXT_FIREBASE_VAPID_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: 'mailto:a9535487323@yandex.ru'
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
